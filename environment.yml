# CPU environment for Windows and Linux. Run from this release directory:
#   conda env create -f environment.yml
#   conda activate spalmc
#   python -m pip install -e ".[notebook]" --no-deps
# This is a bounded environment specification, not a platform-specific lockfile.
name: spalmc
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.11
  - pip>=24,<26
  - pytorch=2.5.1
  - cpuonly=2.0
  - numpy>=1.26,<2
  - pandas>=2.1,<3
  - scipy>=1.11,<1.15
  - scikit-learn>=1.3,<1.9
  - matplotlib>=3.8,<3.11
  - anndata>=0.10.9,<0.13
  - pyyaml>=6,<7
  - jupyterlab>=4,<5
  - ipykernel>=6.28,<7
  - nbformat>=5.9,<6
  - ipython>=8.18,<10
  - setuptools>=69,<81
  - wheel>=0.43,<1
